name: Core and standalone build

on:
  push:
    paths:
      - 'dakhl/**'
      - '.github/workflows/dakhl-ci.yml'
  pull_request:
    paths:
      - 'dakhl/**'
      - '.github/workflows/dakhl-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: dakhl

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test financial and calendar logic
        run: node tests/core.test.cjs

      - name: Rebuild the standalone app
        run: python3 build.py

      - name: Check generated HTML is current
        run: git diff --exit-code -- index.html
